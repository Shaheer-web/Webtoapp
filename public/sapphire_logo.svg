<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="facetTop" x1="64" y1="16" x2="64" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="facetLeft" x1="16" y1="52" x2="64" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="facetRight" x1="64" y1="52" x2="112" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="facetCenter" x1="40" y1="36" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- App Icon Background Rounded Square -->
  <rect width="128" height="128" rx="32" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="124" height="124" rx="30" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="2" fill="none" />
  
  <!-- Sapphire Gemstone Facets -->
  <g filter="url(#glow)">
    <!-- Top Table Facet -->
    <polygon points="44,28 84,28 98,52 64,52 30,52" fill="url(#facetTop)" stroke="#93C5FD" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Upper Left Facet -->
    <polygon points="44,28 30,52 16,52" fill="#60A5FA" stroke="#93C5FD" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Upper Right Facet -->
    <polygon points="84,28 112,52 98,52" fill="#38BDF8" stroke="#93C5FD" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Middle Left Facet -->
    <polygon points="30,52 64,52 50,102 16,52" fill="url(#facetLeft)" stroke="#60A5FA" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Middle Right Facet -->
    <polygon points="64,52 98,52 112,52 78,102" fill="url(#facetRight)" stroke="#93C5FD" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Bottom Point Facet Left -->
    <polygon points="50,102 64,52 64,112" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Bottom Point Facet Right -->
    <polygon points="78,102 64,52 64,112" fill="#1E40AF" stroke="#60A5FA" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Inner Gem Sparkle Core -->
    <polygon points="52,44 76,44 84,58 64,72 44,58" fill="url(#facetCenter)" opacity="0.9" />
    <!-- Highlight Shimmer -->
    <path d="M 44 32 L 64 28 L 54 48 Z" fill="#FFFFFF" opacity="0.6" />
  </g>
</svg>
